# -----------------------------------------------------------------------
# End-to-end config: full pipeline — ASR + Diarization + LLM cleanup
# -----------------------------------------------------------------------
dataset_version: gold_v1

models:
  asr:
    name: whisper-large-v3
    provider: local
    device: cuda:0
    precision: float16
  diarization:
    name: pyannote/speaker-diarization-3.1
    provider: hf
    device: cuda:0
  llm:
    name: claude-sonnet-4-6
    provider: anthropic
    temperature: 0.0
    max_tokens: 4096

decoding_params:
  beam_size: 5
  temperature: 0.0
  no_speech_threshold: 0.6
  compression_ratio_threshold: 2.4
  language: en

diarization_params:
  collar_sec: 0.25
  skip_overlap: false
  min_speakers: null
  max_speakers: null

prompts:
  cleanup: eval/prompts/cleanup_v1.txt

sss:
  enabled: true
  ollama_url: http://localhost:11434
  model: nomic-embed-text
  chunk_strategy: sentence_window
  target_sentences: 3
  max_chars: 900

cost_config:
  gpu_hourly_rate_usd: 0.0
  llm_price_per_1k_in: 0.003
  llm_price_per_1k_out: 0.015
  notes: "Update prices before cost-tracking runs"

notes: null
