[project]
name = "sss"
version = "0.1.0"
description = "Sentence Similarity Score (SSS) evaluation system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "rich>=13.0",
    # eval pipeline
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
# Install for production-grade DER scoring (requires torch)
diarization = [
    "pyannote.core>=5.0",
    "pyannote.metrics>=3.2",
]
# Install for running all tests
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["kimi", "codex_version", "claude_version", "eval"]

[project.scripts]
kimi = "kimi.cli:app"
codex-sss = "codex_version.cli:app"
claude-sss = "claude_version.cli:app"
