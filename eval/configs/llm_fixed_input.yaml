# -----------------------------------------------------------------------
# LLM fixed-input config: LLM cleanup applied to frozen baseline outputs
# -----------------------------------------------------------------------
# Point baseline_run_id at the run whose predictions you want to clean.
dataset_version: gold_v1
baseline_run_id: null        # e.g. 2026-05-10T09-00-00Z_baseline_gold_v1_abc1234

models:
  asr: null                  # not used in this stage
  diarization: null
  llm:
    name: claude-sonnet-4-6
    provider: anthropic
    temperature: 0.0
    max_tokens: 4096

prompts:
  cleanup: eval/prompts/cleanup_v1.txt
  # speaker_fix: eval/prompts/speaker_fix_v2.txt

sss:
  enabled: true
  ollama_url: http://localhost:11434
  model: nomic-embed-text
  chunk_strategy: sentence_window
  target_sentences: 3
  max_chars: 900

cost_config:
  gpu_hourly_rate_usd: 0.0
  llm_price_per_1k_in: 0.003    # example: $3 / 1M input tokens
  llm_price_per_1k_out: 0.015   # example: $15 / 1M output tokens
  notes: "Update prices before cost-tracking runs"

notes: null
